<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxora Hotels — Find Your Perfect Stay in India</title>
    <meta name="description" content="Discover and book premium hotels across India most vibrant cities. From Mumbai to Jaipur, find luxury stays tailored for you.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header" id="app-header">
        <div class="header-container">
            <a href="#" class="logo-area" id="nav-logo">
                <span class="logo-icon"><i data-lucide="building-2"></i></span>
                <span class="logo-text">LUXORA</span>
                <span class="logo-sub">Hotels</span>
            </a>
            <div class="search-bar-container" id="header-search-bar">
                <div class="search-input-wrapper">
                    <i data-lucide="search" class="search-icon"></i>
                    <input type="text" id="search-input" placeholder="Search hotels, cities..." autocomplete="off">
                    <button class="search-clear-btn" id="search-clear-btn"><i data-lucide="x"></i></button>
                </div>
            </div>
            <nav class="nav-actions">
                <button class="nav-btn active" id="btn-goto-listing" title="Browse Hotels">
                    <i data-lucide="hotel"></i>
                    <span>Hotels</span>
                </button>
                <button class="nav-btn" id="btn-goto-wishlist" title="Wishlist">
                    <i data-lucide="heart"></i>
                    <span class="nav-badge wishlist-badge" id="wishlist-badge-count">0</span>
                    <span>Wishlist</span>
                </button>
                <button class="nav-btn" id="btn-goto-bookings" title="My Bookings">
                    <i data-lucide="calendar-check"></i>
                    <span class="nav-badge bookings-badge" id="bookings-badge-count">0</span>
                    <span>Bookings</span>
                </button>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <section class="hero-section" id="hero-section">
            <div class="hero-bg-slider" id="hero-bg-slider">
                <div class="hero-slide active" style="background-image:url('https://images.unsplash.com/photo-1551918120-9739cb430c6d?w=1600&q=80')"></div>
                <div class="hero-slide" style="background-image:url('https://images.unsplash.com/photo-1566073771259-6a8506099945?w=1600&q=80')"></div>
                <div class="hero-slide" style="background-image:url('https://images.unsplash.com/photo-1520250497591-112f2f40a3f4?w=1600&q=80')"></div>
                <div class="hero-slide" style="background-image:url('https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?w=1600&q=80')"></div>
            </div>
            <div class="hero-overlay"></div>
            <div class="hero-content">
                <p class="hero-eyebrow">India Premier Hotel Discovery</p>
                <h1 class="hero-title">Find Your <span class="hero-accent">Perfect</span> Stay</h1>
                <p class="hero-subtitle">500+ handpicked hotels across 12 cities — from 1,200 to 10,000 per night</p>
                <div class="hero-search-box">
                    <div class="hero-search-input-wrap">
                        <i data-lucide="search"></i>
                        <input type="text" id="hero-search-input" placeholder="Search hotel or city..." autocomplete="off">
                    </div>
                    <button class="hero-search-btn" id="hero-search-btn">
                        <i data-lucide="search"></i><span>Search</span>
                    </button>
                </div>
                <div class="hero-city-pills" id="hero-city-pills">
                    <span class="city-pill" data-city="Goa">Goa</span>
                    <span class="city-pill" data-city="Jaipur">Jaipur</span>
                    <span class="city-pill" data-city="Mumbai">Mumbai</span>
                    <span class="city-pill" data-city="Delhi">Delhi</span>
                    <span class="city-pill" data-city="Bengaluru">Bengaluru</span>
                    <span class="city-pill" data-city="Hyderabad">Hyderabad</span>
                </div>
            </div>
            <div class="hero-dots" id="hero-dots">
                <span class="hero-dot active" data-index="0"></span>
                <span class="hero-dot" data-index="1"></span>
                <span class="hero-dot" data-index="2"></span>
                <span class="hero-dot" data-index="3"></span>
            </div>
        </section>

        <section class="page-view active" id="listing-page">
            <div class="filters-section" id="controls-section">
                <div class="filters-container">
                    <div class="filter-row">
                        <div class="filter-group">
                            <label for="city-select">City</label>
                            <div class="select-wrapper">
                                <select id="city-select">
                                    <option value="">All Cities</option>
                                    <option value="Ahmedabad">Ahmedabad</option>
                                    <option value="Bengaluru">Bengaluru</option>
                                    <option value="Chennai">Chennai</option>
                                    <option value="Delhi">Delhi</option>
                                    <option value="Goa">Goa</option>
                                    <option value="Gurgaon">Gurgaon</option>
                                    <option value="Hyderabad">Hyderabad</option>
                                    <option value="Jaipur">Jaipur</option>
                                    <option value="Kolkata">Kolkata</option>
                                    <option value="Mumbai">Mumbai</option>
                                    <option value="Noida">Noida</option>
                                    <option value="Pune">Pune</option>
                                </select>
                                <i data-lucide="chevron-down"></i>
                            </div>
                        </div>
                        <div class="filter-group">
                            <label for="min-price">Min Price (Rs)</label>
                            <div class="range-input-wrapper">
                                <input type="number" id="min-price" placeholder="Min" min="0" step="500">
                            </div>
                        </div>
                        <div class="filter-group">
                            <label for="max-price">Max Price (Rs)</label>
                            <div class="range-input-wrapper">
                                <input type="number" id="max-price" placeholder="Max" min="0" step="500">
                            </div>
                        </div>
                        <div class="filter-group">
                            <label for="min-rating-select">Min Rating</label>
                            <div class="select-wrapper">
                                <select id="min-rating-select">
                                    <option value="">Any</option>
                                    <option value="2">2+</option>
                                    <option value="3">3+</option>
                                    <option value="3.5">3.5+</option>
                                    <option value="4">4+</option>
                                    <option value="4.5">4.5+</option>
                                </select>
                                <i data-lucide="chevron-down"></i>
                            </div>
                        </div>
                        <div class="filter-group">
                            <label for="sort-select">Sort By</label>
                            <div class="select-wrapper">
                                <select id="sort-select">
                                    <option value="">Featured</option>
                                    <option value="price">Price: Low to High</option>
                                    <option value="-price">Price: High to Low</option>
                                    <option value="-rating">Rating: High to Low</option>
                                    <option value="rating">Rating: Low to High</option>
                                </select>
                                <i data-lucide="chevron-down"></i>
                            </div>
                        </div>
                        <button class="btn-apply-filters" id="btn-apply-filters">Apply Filters</button>
                        <button class="btn-reset-filters" id="btn-reset-filters">Reset</button>
                    </div>
                </div>
            </div>

            <div class="results-info-bar" id="results-info-bar">
                <div class="results-info-container">
                    <span id="results-count-text">Loading hotels...</span>
                    <div class="view-toggle">
                        <button class="view-btn active" id="btn-grid-view" title="Grid View"><i data-lucide="layout-grid"></i></button>
                        <button class="view-btn" id="btn-list-view" title="List View"><i data-lucide="layout-list"></i></button>
                    </div>
                </div>
            </div>

            <div class="hotels-grid-wrapper">
                <div class="hotels-grid" id="hotels-grid">
                    <div class="shimmer-container" id="shimmer-container">
                        <div class="shimmer-card"></div>
                        <div class="shimmer-card"></div>
                        <div class="shimmer-card"></div>
                        <div class="shimmer-card"></div>
                        <div class="shimmer-card"></div>
                        <div class="shimmer-card"></div>
                    </div>
                </div>
                <div class="load-more-wrapper" id="load-more-wrapper" style="display:none;">
                    <button class="btn-load-more" id="btn-load-more">
                        <i data-lucide="refresh-cw"></i><span>Load More Hotels</span>
                    </button>
                </div>
            </div>
        </section>

        <section class="page-view" id="details-page">
            <div class="back-nav-container">
                <button class="btn-back" id="btn-back-to-listing">
                    <i data-lucide="arrow-left"></i><span>Back to Hotels</span>
                </button>
            </div>
            <div class="hotel-details-container" id="hotel-details-content"></div>
        </section>

        <section class="page-view" id="wishlist-page">
            <div class="page-header-area">
                <h1 class="page-title">Your Wishlist</h1>
            </div>
            <div class="wishlist-grid" id="wishlist-grid"></div>
        </section>

        <section class="page-view" id="bookings-page">
            <div class="page-header-area">
                <h1 class="page-title">My Bookings</h1>
            </div>
            <div class="bookings-list" id="bookings-list"></div>
        </section>
    </main>

    <div class="modal-overlay" id="booking-modal-overlay" style="display:none;">
        <div class="modal-content booking-modal" id="booking-modal-content">
            <button class="modal-close-btn" id="booking-modal-close-btn"><i data-lucide="x"></i></button>
            <div id="booking-modal-body"></div>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>
    <script src="app.js"></script>
</body>
</html>
